name: Build LingoWorld AI APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore Firebase google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON repository secret is missing or empty. Without it the APK builds WITHOUT Firebase and the app cannot sign in or load data. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('app/google-services.json'))['project_info']['project_id'])")
          echo "Restored app/google-services.json from GitHub Secret (Firebase project: $PROJECT_ID)."

      - name: Prepare debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Decoded debug.keystore from GitHub Secret."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore for CI build."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify Firebase config is bundled in the APK
        run: |
          GEN="app/build/generated/res/google-services/debug/values/values.xml"
          if [ ! -f "$GEN" ] || ! grep -q 'name="google_api_key"' "$GEN"; then
            echo "::error::The google-services plugin did not generate Firebase resources. The APK would be Firebase-dead, so the build fails here instead of uploading it."
            exit 1
          fi
          if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'resources.arsc'; then
            echo "::error::Expected APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "OK: Firebase resources generated and debug APK produced."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoWorld-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
